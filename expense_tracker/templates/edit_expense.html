{% extends 'expense_base.html' %}


{% block title %}Edit Expense - Expense Tracker{% endblock title %}


{% block content %}
<div class = "form-container">
    <h2>Edit Expense</h2>

    <form method = "POST" action = "{{ url_for('edit_expense', expense_id = expense.id)}}" class = "expense-form">
        <div class = "form-group">
            <label for = "amount">Amount *</label>
            <input type = "number"
                    id = "amount"
                    name = "amount"
                    step = "0.01"
                    min = "0.01"
                    value = "{{ expense.amount }}"
                    required>
        </div>
        
        <div class = "form-group">
            <label for="category">Category *</label>
            <select id = "category" name = "category" required>
                <option value = "">Select a category</option>
                <option value = "Food" {% if expense.category == 'Food'%}selected{% endif%}></option>
                <option value = "Transport" {% if expense.category == 'Transport'%}selected{% endif %}></option>
                <option value = "Shopping" {% if expense.category == 'Shopping'%}selected{% endif %}></option>
                <option value = "Entertainment" {% if expense.category == 'Entertainment'%}selected{% endif%}></option>
                <option value = "Bills" {% if expense.category == 'Bills' %}selected{% endif %}></option>
                <option value = "Health" {% if expense.category == 'Health'%}selected{% endif %}></option>
                <option value = "Other" {% if expense.category == "Other"%}selected {% endif %}></option>
            </select>
        </div>

        <div class = "form-group">
            <label for = "description">Description</label>
            <input type = "text"
                    id = "description"
                    name = "date"
                    value = "{{ expense.date.strftime('%Y-%m-%d')}}"
                    required>
        </div>

        <div class = "form-actions">
            <button type = "submit" class = "btn=primary">Update Expense</button>
            <a href = "{{ url_for('expense_index')}}" class = "btn-secondary">Cancel</a>
        </div>
    </form>
</div>
    
{% endblock content %}

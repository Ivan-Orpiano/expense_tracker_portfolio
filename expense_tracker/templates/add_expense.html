{% extends "expense_base.html"%}

{% block title %}Add Expense - Expense Tracker{% endblock title %}

{% block content %}
        
    <div class = "form-container">
        <h2>Add New Expense</h2>
        <form method = "POST" action = "{{ url_for('add_expense') }}" class = "expense-form">
            <div class = "form-group">
                <label for = "amount">Amount *</label>
                <input type = "number"
                        id = "amount"
                        name = "amount"
                        step = "0.01"
                        min = "0.01"
                        placeholder = "25.50"
                        required></div>

        <div class = "form-group">
            <label for = "category" >Category *</label>
            <select id = "category" name = "category" require>
                <option value="">Select a category</option>
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Bills">📄 Bills</option>
                <option value="Health">🏥 Health</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

            <div class = "form-group">
                <label for = "description">Description</label>
                <input type = "text"
                        id = "description"
                        name = "description"
                        placeholder = "Coffee at Starbucks">
            </div>
            <div class = "form-actions">
                <button type = "submit" class = "btn-primary">Save Expense</button>
                <a href="{{ url_for('index') }}" class = "btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();
    </script>
{% endblock content %}
